name: Continuous Delivery (CD)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Backend Gateway
        run: npm exec nx build gateway

      - name: Package Backend Gateway Distribution
        uses: actions/upload-artifact@v4
        with:
          name: backend-production-dist
          path: apps/gateway/dist/
          retention-days: 30

      - name: Build Frontend for GitHub Pages
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.tt-tournament.com/graphql' }}
        run: npm exec nx build tt-client

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Frontend Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/tt-client/dist/

  deploy:
    name: Deploy Frontend to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
